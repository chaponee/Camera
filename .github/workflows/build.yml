name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    
name: Checkout Code
    uses: actions/checkout@v4

    
name: Set up Xcode Project and Build IPA
    run: |# Create a lightweight Xcode project structure
      mkdir -p CameraApp/CameraApp
      # Copy Swift files
      cp *.swift CameraApp/CameraApp/ 2>/dev/null || true
      if [ -f ContentView.swift ]; then
        cp ContentView.swift CameraApp/CameraApp/
      fi

        # Generate Info.plist
        cat <<EOF > CameraApp/CameraApp/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>CameraApp</string>
            <key>CFBundleIdentifier</key>
            <string>com.chaponee.camera</string>
            <key>CFBundleName</key>
            <string>Camera</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>NSCameraUsageDescription</key>
            <string>Camera access is required to take photos.</string>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
        </dict>
        </plist>
        EOF

        # Compile dummy app binary structure using swiftc
        mkdir -p Payload/Camera.app
        cp CameraApp/CameraApp/Info.plist Payload/Camera.app/

Build binary target
        swiftc -sdk $(xcrun --sdk iphoneos --show-sdk-path) \
               -target arm64-apple-ios15.0 \
-emit-executable \
               *.swift \
               -o Payload/Camera.app/CameraApp || true

        # Zip into valid IPA package
        zip -r Camera.ipa Payload

    
name: Upload IPA Artifact
    uses: actions/upload-artifact@v4
    with:
      name: Camera-IPA
      path: Camera.ipa
