name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    
name: Checkout Code
    uses: actions/checkout@v4

    
name: Select Xcode
    run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

    
name: Build App
    run: |
      xcodebuild -project Camera.xcodeproj \-scheme Camera \-sdk iphoneos \-configuration Release \-derivedDataPath build \
                 CODE_SIGN_IDENTITY="" \
                 CODE_SIGNING_REQUIRED=NO \
                 CODE_SIGNING_ALLOWED=NO

    
name: Package IPA
    run: |
      mkdir -p Payload
      cp -r build/Build/Products/Release-iphoneos/Camera.app Payload/
      zip -r Camera.ipa Payload

    
name: Upload IPA Artifact
    uses: actions/upload-artifact@v4
    with:
      name: Camera-IPA
      path: Camera.ipa
