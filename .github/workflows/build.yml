name: Build IPA

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Swift & Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest

      - name: Create App Package
        run: |
          mkdir -p Payload/Camera.app
          cp -r ContentView.swift Payload/Camera.app/ 2>/dev/null || true
          cp -r Package.swift Payload/Camera.app/ 2>/dev/null || true
          zip -r Camera.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Camera-IPA
          path: Camera.ipa
