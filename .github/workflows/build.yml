name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    
name: Checkout Code
    uses: actions/checkout@v4

    
name: Create Xcode Project & App Shell
    run: |# Create App directory structure
      mkdir -p CameraApp/CameraApp
      # Copy Swift files into app folder
      cp *.swift CameraApp/CameraApp/ 2>/dev/null || true

        # Create Info.plist
        cat <<EOF > CameraApp/CameraApp/Info.plist
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>CameraApp</string>
            <key>CFBundleIdentifier</key>
            <string>com.chaponee.camera</string>
            <key>CFBundleName</key>
            <string>Camera</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>MinimumOSVersion</key>
            <string>15.0</string>
            <key>NSCameraUsageDescription</key>
            <string>Camera access is required to take photos.</string>
        </dict>
        </plist>
        EOF

        # Package raw app layout
        mkdir -p Payload/Camera.app
        cp CameraApp/CameraApp/Info.plist Payload/Camera.app/

Compile Swift source into executable binary
        xcrun -sdk iphoneos swiftc -target arm64-apple-ios15.0 \
          -import-objc-header /dev/null \
          *.swift -o Payload/Camera.app/CameraApp || true

        # Create final package
        zip -r Camera.ipa Payload

    
name: Upload IPA Artifact
    uses: actions/upload-artifact@v4
    with:
      name: Camera-IPA
      path: Camera.ipa
